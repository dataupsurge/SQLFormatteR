[package]
name = "SQLFormatteR"
version = "0.0.1"
edition = "2021"
rust-version = "1.78.0"

[lib]
crate-type = [ "rlib", "staticlib" ]
name = "SQLFormatteR"

[[bin]]
name = "document"
path = "document.rs"

[dependencies]
extendr-api = "0.9.0"
extendr-macros = "0.9.0"
sqlformat = "0.3.5"

[profile.release]
lto = true
codegen-units = 1
